name: draft
on:
  schedule: [{ cron: "*/15 * * * *" }]
  workflow_dispatch:
    inputs:
      idea_id:
        description: "Idea card page id (blank = all chosen cards)"
        required: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Draft chosen cards
        run: |
          if [ -n "${{ inputs.idea_id }}" ]; then
            uv run python -m src.draft --idea "${{ inputs.idea_id }}"
          else
            uv run python -m src.draft
          fi
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
