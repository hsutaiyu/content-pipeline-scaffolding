name: ingest
on:
  schedule: [{ cron: "0 1 * * *" }]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python -m adapters.notion_source
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      - name: Commit feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/raw
          git diff --cached --quiet || git commit -m "chore: ingest feed"
          git push
