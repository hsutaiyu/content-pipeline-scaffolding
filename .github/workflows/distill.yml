name: distill
on:
  push:
    paths: ["feed/raw/**"]
  workflow_dispatch:
    inputs:
      limit:
        description: "Max raw items to distill this run (0 = all)"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  distill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python -m src.distill
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          DISTILL_LIMIT: ${{ inputs.limit }}
      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/distilled-manifest.json
          git diff --cached --quiet || git commit -m "chore: update distilled manifest"
          git push
